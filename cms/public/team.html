<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Team</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="layout">
    <nav>
      <h1>CMS</h1>
      <a href="/articles.html">Articles</a>
      <a href="/add-article.html">Add Article</a>
      <a href="/articles-health.html">Articles Health</a>
      <a href="/articles-update.html">Articles Update</a>
      <a class="active" href="/team.html">Team</a>
      <a href="/dashboard.html">Dashboard</a>
    </nav>
    <main>
      <div class="banner" data-session-banner></div>
      <h2>Team</h2>
      <table id="table">
        <thead>
          <tr>
            <th data-col="name" class="sortable">Name <span class="sort-icon">⇅</span></th>
            <th data-col="role" class="sortable">Role <span class="sort-icon">⇅</span></th>
            <th data-col="slug" class="sortable">Slug <span class="sort-icon">⇅</span></th>
          </tr>
        </thead>
        <tbody id="list"></tbody>
      </table>
      <h3>Create / edit</h3>
      <form id="form">
        <label>Name <input name="name" required /></label>
        <label>Role <input name="role" required /></label>
        <label>Bio <textarea name="bio" rows="8" required></textarea></label>
        <label>Credentials (one per line) <textarea name="credentials" rows="6"></textarea></label>
        <label>knowsAbout (comma or line) <textarea name="knowsAbout" rows="4"></textarea></label>
        <label>sameAs URLs (one per line) <textarea name="sameAs" rows="4"></textarea></label>
        <label>Email <input name="email" type="email" /></label>
        <label>Photo (jpg) <input name="photo" type="file" accept=".jpg,.jpeg,.png" /></label>
        <button type="submit">Save member</button>
      </form>
      <p id="out"></p>
    </main>
  </div>
  <script type="module">
    import { api } from "/app.js";
    let allTeam = [];
    let sortCol = "name";
    let sortDir = "asc";

    function renderTable() {
      const rows = [...allTeam].sort((a, b) => {
        const av = (sortCol === "slug" ? a.slug : a.data[sortCol] || "").toString();
        const bv = (sortCol === "slug" ? b.slug : b.data[sortCol] || "").toString();
        return sortDir === "asc" ? av.localeCompare(bv) : bv.localeCompare(av);
      });
      document.getElementById("list").innerHTML = rows.map((t) =>
        `<tr><td>${t.data.name}</td><td>${t.data.role}</td><td class="muted">${t.slug}</td></tr>`
      ).join("");
    }

    async function load() {
      const data = await api("/api/team");
      allTeam = data.team;
      renderTable();
    }

    document.querySelectorAll("th.sortable").forEach((th) => {
      th.onclick = () => {
        const col = th.dataset.col;
        if (sortCol === col) sortDir = sortDir === "asc" ? "desc" : "asc";
        else { sortCol = col; sortDir = "asc"; }
        document.querySelectorAll("th.sortable").forEach((t) => t.classList.remove("sort-asc", "sort-desc"));
        th.classList.add(sortDir === "asc" ? "sort-asc" : "sort-desc");
        renderTable();
      };
    });
    document.querySelector('[data-col="name"]').classList.add("sort-asc");
    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        const data = await api("/api/team", { method: "POST", body: fd });
        document.getElementById("out").innerHTML = `<span class="ok">Saved ${data.slug}</span>`;
        await load();
      } catch (err) {
        document.getElementById("out").innerHTML = `<span class="err">${err.message}</span>`;
      }
    };
    load();
  </script>
</body>
</html>
