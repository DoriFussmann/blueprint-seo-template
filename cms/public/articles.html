<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Articles</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="layout">
    <nav>
      <h1>CMS</h1>
      <a class="active" href="/articles.html">Articles</a>
      <a href="/add-article.html">Add Article</a>
      <a href="/articles-health.html">Articles Health</a>
      <a href="/articles-update.html">Articles Update</a>
      <a href="/team.html">Team</a>
      <a href="/dashboard.html">Dashboard</a>
    </nav>
    <main>
      <div class="banner" data-session-banner></div>
      <h2>Articles</h2>
      <p class="muted">Sorted by updatedDate || date, newest first. Max upload 10MB per file.</p>
      <div class="flex" style="margin-bottom:12px; width:100%;">
        <input id="search-title" type="search" placeholder="Search by title…" style="flex:1; margin-right:8px;" />
        <select id="filter-pillar" style="flex:1;">
          <option value="">All Pillar Keywords</option>
        </select>
      </div>
      <table id="table">
        <thead>
          <tr>
            <th data-col="title" class="sortable">Title <span class="sort-icon">⇅</span></th>
            <th data-col="slug" class="sortable">Slug <span class="sort-icon">⇅</span></th>
            <th data-col="author" class="sortable">Author <span class="sort-icon">⇅</span></th>
            <th data-col="date" class="sortable">Date <span class="sort-icon">⇅</span></th>
            <th data-col="draft" class="sortable">Status <span class="sort-icon">⇅</span></th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </main>
  </div>
  <script type="module">
    import { api } from "/app.js";

    let allArticles = [];
    let sortCol = "date";
    let sortDir = "desc";

    const data = await api("/api/articles");
    allArticles = data.articles;

    const pillars = [...new Set(allArticles.map(a => a.pillarKeyword).filter(Boolean))];
    const pillarSel = document.getElementById("filter-pillar");
    pillars.forEach(p => {
      const o = document.createElement("option");
      o.value = p; o.textContent = p;
      pillarSel.appendChild(o);
    });

    function sortValue(a, col) {
      if (col === "date") return (a.updatedDate || a.date || "").toString();
      if (col === "draft") return a.draft ? "draft" : "published";
      return (a[col] || "").toString();
    }

    function renderTable() {
      const q = document.getElementById("search-title").value.toLowerCase();
      const pillar = pillarSel.value;
      let rows = allArticles.filter(a =>
        (!q || a.title.toLowerCase().includes(q)) &&
        (!pillar || a.pillarKeyword === pillar)
      );
      rows.sort((a, b) => {
        const av = sortValue(a, sortCol);
        const bv = sortValue(b, sortCol);
        return sortDir === "asc" ? av.localeCompare(bv) : bv.localeCompare(av);
      });
      const tb = document.querySelector("tbody");
      tb.innerHTML = rows.map(a => `<tr>
        <td>${a.title}</td>
        <td>${a.slug}</td>
        <td>${a.author}</td>
        <td>${a.updatedDate || a.date}</td>
        <td>${a.draft ? "draft" : "published"}</td>
        <td style="white-space:nowrap;">
          ${a.published_url
            ? `<a href="${a.published_url}" target="_blank" rel="noopener" title="Open live URL" style="margin-right:6px;">🔗</a>`
            : ""}
          <button class="secondary btn-toggle-draft" data-slug="${a.slug}" data-draft="${a.draft}" style="padding:4px 8px;min-height:unset;font-size:11px;">
            ${a.draft ? "Publish" : "→ Draft"}
          </button>
          <button class="secondary btn-delete" data-slug="${a.slug}" style="padding:4px 8px;min-height:unset;font-size:11px;color:var(--admin-danger);border-color:var(--admin-danger);">
            Delete
          </button>
        </td>
      </tr>`).join("");

      tb.querySelectorAll(".btn-toggle-draft").forEach(btn => {
        btn.onclick = async () => {
          const slug = btn.dataset.slug;
          const isDraft = btn.dataset.draft === "true";
          if (!confirm(`Set "${slug}" to ${isDraft ? "published" : "draft"}?`)) return;
          await api("/api/articles/set-draft", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ slug, draft: !isDraft })
          });
          const a = allArticles.find(x => x.slug === slug);
          if (a) a.draft = !isDraft;
          renderTable();
        };
      });

      tb.querySelectorAll(".btn-delete").forEach(btn => {
        btn.onclick = async () => {
          if (!confirm(`Permanently delete "${btn.dataset.slug}"? This cannot be undone.`)) return;
          await api("/api/articles/delete", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ slug: btn.dataset.slug })
          });
          allArticles = allArticles.filter(a => a.slug !== btn.dataset.slug);
          renderTable();
        };
      });
    }

    document.querySelectorAll("th.sortable").forEach(th => {
      th.onclick = () => {
        const col = th.dataset.col;
        if (sortCol === col) sortDir = sortDir === "asc" ? "desc" : "asc";
        else { sortCol = col; sortDir = col === "date" ? "desc" : "asc"; }
        document.querySelectorAll("th.sortable").forEach(t => t.classList.remove("sort-asc","sort-desc"));
        th.classList.add(sortDir === "asc" ? "sort-asc" : "sort-desc");
        renderTable();
      };
    });

    document.getElementById("search-title").addEventListener("input", renderTable);
    pillarSel.addEventListener("change", renderTable);

    document.querySelector('[data-col="date"]').classList.add("sort-desc");
    renderTable();
  </script>
</body>
</html>
