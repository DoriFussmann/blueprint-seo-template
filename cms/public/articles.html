<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Articles</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="layout">
    <nav>
      <h1>CMS</h1>
      <a class="active" href="/articles.html">Articles</a>
      <a href="/add-article.html">Add Article</a>
      <a href="/articles-health.html">Articles Health</a>
      <a href="/articles-update.html">Articles Update</a>
      <a href="/team.html">Team</a>
      <a href="/dashboard.html">Dashboard</a>
    </nav>
    <main>
      <div class="banner" data-session-banner></div>
      <h2>Articles</h2>
      <p class="muted">Sorted by updatedDate || date, newest first. Max upload 10MB per file.</p>
      <table id="table"><thead><tr><th>Title</th><th>Slug</th><th>Author</th><th>Date</th><th>Draft</th></tr></thead><tbody></tbody></table>
    </main>
  </div>
  <script type="module">
    import { api } from "/app.js";
    const data = await api("/api/articles");
    const tb = document.querySelector("tbody");
    tb.innerHTML = data.articles.map((a) => `<tr>
      <td>${a.title}</td><td>${a.slug}</td><td>${a.author}</td>
      <td>${a.updatedDate || a.date}</td><td>${a.draft ? "draft" : ""}</td>
    </tr>`).join("");
  </script>
</body>
</html>
