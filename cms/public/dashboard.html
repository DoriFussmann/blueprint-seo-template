<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="layout">
    <nav>
      <h1>CMS</h1>
      <a href="/articles.html">Articles</a>
      <a href="/add-article.html">Add Article</a>
      <a href="/articles-health.html">Articles Health</a>
      <a href="/articles-update.html">Articles Update</a>
      <a href="/team.html">Team</a>
      <a class="active" href="/dashboard.html">Dashboard</a>
    </nav>
    <main>
      <div class="banner" data-session-banner></div>
      <h2>Dashboard</h2>
      <p class="muted">Read-only. Max upload 10MB per file on write screens.</p>
      <table>
        <thead>
          <tr>
            <th data-col="title" class="sortable">Title <span class="sort-icon">⇅</span></th>
            <th data-col="slug" class="sortable">Slug <span class="sort-icon">⇅</span></th>
            <th data-col="author" class="sortable">Author <span class="sort-icon">⇅</span></th>
            <th data-col="pillarKeyword" class="sortable">Pillar <span class="sort-icon">⇅</span></th>
            <th data-col="supportingKeyword" class="sortable">Supporting <span class="sort-icon">⇅</span></th>
            <th data-col="articleType" class="sortable">Type <span class="sort-icon">⇅</span></th>
            <th data-col="date" class="sortable">Date <span class="sort-icon">⇅</span></th>
            <th data-col="updatedDate" class="sortable">Updated <span class="sort-icon">⇅</span></th>
            <th data-col="draft" class="sortable">Draft <span class="sort-icon">⇅</span></th>
            <th data-col="internalCount" class="sortable">In <span class="sort-icon">⇅</span></th>
            <th data-col="externalCount" class="sortable">Ext <span class="sort-icon">⇅</span></th>
          </tr>
        </thead>
        <tbody id="tb"></tbody>
      </table>
    </main>
  </div>
  <script type="module">
    import { api } from "/app.js";
    const data = await api("/api/articles");
    let allArticles = data.articles;
    let sortCol = "date";
    let sortDir = "desc";

    function sortValue(a, col) {
      if (col === "date") return (a.updatedDate || a.date || "").toString();
      if (col === "draft") return a.draft ? "yes" : "";
      return (a[col] ?? "").toString();
    }

    function renderTable() {
      const rows = [...allArticles].sort((a, b) => {
        const av = sortValue(a, sortCol);
        const bv = sortValue(b, sortCol);
        return sortDir === "asc" ? av.localeCompare(bv, undefined, { numeric: true }) : bv.localeCompare(av, undefined, { numeric: true });
      });
      document.getElementById("tb").innerHTML = rows.map((a) => `<tr>
        <td>${a.title}</td><td>${a.slug}</td><td>${a.author}</td>
        <td>${a.pillarKeyword || ""}</td><td>${a.supportingKeyword || ""}</td>
        <td>${a.articleType || ""}</td><td>${a.date || ""}</td><td>${a.updatedDate || ""}</td>
        <td>${a.draft ? "yes" : ""}</td><td>${a.internalCount}</td><td>${a.externalCount}</td>
      </tr>`).join("");
    }

    document.querySelectorAll("th.sortable").forEach((th) => {
      th.onclick = () => {
        const col = th.dataset.col;
        if (sortCol === col) sortDir = sortDir === "asc" ? "desc" : "asc";
        else { sortCol = col; sortDir = col === "date" || col === "updatedDate" ? "desc" : "asc"; }
        document.querySelectorAll("th.sortable").forEach((t) => t.classList.remove("sort-asc", "sort-desc"));
        th.classList.add(sortDir === "asc" ? "sort-asc" : "sort-desc");
        renderTable();
      };
    });

    document.querySelector('[data-col="date"]').classList.add("sort-desc");
    renderTable();
  </script>
</body>
</html>
